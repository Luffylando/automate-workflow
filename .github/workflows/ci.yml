name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: automate
          POSTGRES_PASSWORD: automate
          POSTGRES_DB: automate_workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automate -d automate_workflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://automate:automate@localhost:5432/automate_workflow

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Dev smoke test
        run: bash scripts/ci-smoke-dev.sh

  auto-merge:
    name: Auto-merge
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Merge pull request when checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          state="$(gh pr view "$PR_NUMBER" -R "$GH_REPO" --json state,mergeable,mergeStateStatus --jq '.state + " " + (.mergeable // "UNKNOWN") + " " + .mergeStateStatus')"
          echo "PR #$PR_NUMBER state: $state"

          if [ "$(gh pr view "$PR_NUMBER" -R "$GH_REPO" --json state --jq .state)" != "OPEN" ]; then
            echo "PR is not open. Skipping auto-merge."
            exit 0
          fi

          mergeable="$(gh pr view "$PR_NUMBER" -R "$GH_REPO" --json mergeable --jq .mergeable)"
          if [ "$mergeable" != "MERGEABLE" ]; then
            echo "PR is not mergeable ($mergeable). Skipping auto-merge."
            exit 0
          fi

          if gh pr merge "$PR_NUMBER" -R "$GH_REPO" --squash --delete-branch; then
            echo "PR #$PR_NUMBER merged automatically."
          else
            echo "Auto-merge was not possible (branch protection or permissions). PR left open for manual merge."
            exit 0
          fi
