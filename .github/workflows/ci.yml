name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: automate
          POSTGRES_PASSWORD: automate
          POSTGRES_DB: automate_workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automate -d automate_workflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://automate:automate@localhost:5432/automate_workflow

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Dev smoke test
        run: bash scripts/ci-smoke-dev.sh

  mark-ready:
    name: Mark PR ready
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mark draft pull request as ready for review
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const pullRequestId = context.payload.pull_request.node_id;
            const { owner, repo } = context.repo;

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (!pr.draft) {
              core.info(`PR #${prNumber} is already ready for review.`);
              return;
            }

            await github.graphql(
              `mutation($pullRequestId: ID!) {
                markPullRequestReadyForReview(input: { pullRequestId: $pullRequestId }) {
                  pullRequest {
                    isDraft
                  }
                }
              }`,
              { pullRequestId },
            );

            const { data: updated } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (updated.draft) {
              core.setFailed(
                `PR #${prNumber} is still a draft after markPullRequestReadyForReview.`,
              );
              return;
            }

            core.info(`PR #${prNumber} marked ready for review.`);

  auto-merge:
    name: Auto-merge
    needs: mark-ready
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge pull request when checks pass
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            core.info(
              `PR #${prNumber}: state=${pr.state}, draft=${pr.draft}, mergeable=${pr.mergeable}, mergeable_state=${pr.mergeable_state}`,
            );

            if (pr.state !== "open") {
              core.setFailed("PR is not open. Cannot auto-merge.");
              return;
            }

            if (pr.draft) {
              core.setFailed(
                `PR #${prNumber} is still a draft. Mark PR ready must complete first.`,
              );
              return;
            }

            if (pr.mergeable === false) {
              core.setFailed(
                `PR is not mergeable (${pr.mergeable_state}). Cannot auto-merge.`,
              );
              return;
            }

            try {
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: prNumber,
                merge_method: "squash",
              });
              core.info(`PR #${prNumber} merged automatically.`);
            } catch (error) {
              core.setFailed(
                `Auto-merge failed: ${error instanceof Error ? error.message : String(error)}`,
              );
              return;
            }

            const headRef = pr.head.ref;
            const sameRepo =
              pr.head.repo?.full_name === `${owner}/${repo}`;

            if (!headRef || !sameRepo) {
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${headRef}`,
              });
              core.info(`Deleted branch ${headRef}.`);
            } catch (error) {
              core.info(
                `Branch delete skipped: ${error instanceof Error ? error.message : String(error)}`,
              );
            }
