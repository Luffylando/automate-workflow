services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: automate
      POSTGRES_PASSWORD: automate
      POSTGRES_DB: automate_workflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automate -d automate_workflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
